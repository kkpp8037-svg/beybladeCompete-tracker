name: FB Spider Checker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # 確保具備寫入權限

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 feedparser

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Auto commit and push db changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: posts_db.json
          commit_message: "Update posts db [skip ci]"
          commit_user_name: "GitHub Action Bot"
          commit_user_email: "bot@github.com"
