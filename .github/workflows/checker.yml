name: FB Spider Checker

on:
  schedule:
    # 這裡設定每 2 小時自動執行一次（可自行更改）
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允許手動點擊按鈕立即執行

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Commit and push changes if db updated
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add posts_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posts db [skip ci]" && git push)
